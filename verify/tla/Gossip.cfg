\* Three nodes in a line: n0 - n1 - n2.
\*
\* The smallest shape that can strand somebody. Node n1 sits between the other
\* two, so once it knows something it goes silent and n2 is cut off from n0 --
\* which is the bug the simulation found, at minimum size.
\*
\* Kept tiny on purpose: TLC explores breadth-first and the state count grows
\* combinatorially. Three nodes is enough to exhibit the property and small
\* enough to check in seconds.
CONSTANTS
    Nodes = {n0, n1, n2}
    Asserters = {n0, n2}
    Edges = {{n0, n1}, {n1, n2}}

\* Termination is the goal, not a fault. Once everyone agrees, no action is
\* enabled -- TLC calls that deadlock, and here it is exactly the property we
\* want: gossip stops.
CHECK_DEADLOCK FALSE

SPECIFICATION SpecAll

INVARIANT
    TypeOK
    NoForgery

PROPERTY
    Monotone
    Converges
