name: Pages

# Publishes site/ (the replay page) to GitHub Pages. The page is static: its
# data was exported from a recorded run with `smesh quant export-site`, so
# nothing here touches a market-data API or any credential.
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check the replay is present and carries no raw prices
        run: |
          test -s site/data/replay.json
          python3 - <<'EOF'
          import json
          r = json.load(open("site/data/replay.json"))
          assert r["format"] == "smesh-replay/1", r.get("format")
          assert r["run"]["read_only"] is True
          print("replay:", r["run"]["id"], r["run"]["events"], "events")
          EOF
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
