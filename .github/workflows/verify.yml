name: Deep verification

# Deliberately not on every push. These layers are expensive, and a slow
# required check is one people learn to ignore. They run nightly and on demand,
# and they report rather than block.
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      dst_seeds:
        description: "Simulation seeds to sweep"
        default: "2000"

permissions:
  contents: read

concurrency:
  group: deep-verification
  cancel-in-progress: true

jobs:
  simulation:
    name: deterministic simulation soak
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Sweep seeds
        # Every seed is a different delivery order, delay pattern and set of
        # relay coin flips. A failure names the seed, which is the whole point:
        # it reproduces exactly rather than being described.
        env:
          SMESH_DST_SEEDS: ${{ inputs.dst_seeds || '2000' }}
        run: cargo test -p smesh-core --test dst --release

  model:
    name: model checking
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Check the gossip spec
        # Two workers and a 2GB heap, not "auto". TLC will take every core and
        # grow until the kernel stops it, and this model is small enough that
        # needing more would mean the model is wrong.
        env:
          VERIFY_JOBS: "2"
          TLC_HEAP: "2g"
          VERIFY_TIMEOUT: "600"
        run: ./verify/tla.sh

  mutation:
    name: mutation testing
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-mutants
        run: cargo install cargo-mutants --locked

      - name: Mutate the protocol
        # Scope is in .cargo/mutants.toml: protocol crates only. Two jobs, not
        # one per core — the runner has two, and oversubscribing a rebuild-per-
        # mutant workload makes it slower, not faster.
        run: cargo mutants --jobs 2 --no-shuffle --output target/mutants
        continue-on-error: true

      - name: Report survivors
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, pathlib, sys

          p = pathlib.Path("target/mutants/mutants.out/outcomes.json")

          def emit(text):
              # Both to the log and to the run summary, so the survival rate is
              # visible on the Actions page without downloading the artifact.
              print(text)
              summary = os.environ.get("GITHUB_STEP_SUMMARY")
              if summary:
                  with open(summary, "a") as fh:
                      fh.write(text + "\n")

          if not p.exists():
              # A run that produced no outcomes is a failure to report, not a
              # clean bill of health. Fail loudly rather than pass green with an
              # empty artifact.
              emit("## Mutation testing\n\n**No outcomes were produced** \u2014 the mutation run did not complete.")
              sys.exit(1)

          d = json.loads(p.read_text())
          outcomes = d["outcomes"]

          def summ(o):
              return o.get("summary", "")

          caught = sum(summ(o) == "CaughtMutant" for o in outcomes)
          missed = [o for o in outcomes if summ(o) == "MissedMutant"]
          unviable = sum(summ(o) == "Unviable" for o in outcomes)
          timeout = sum(summ(o) == "Timeout" for o in outcomes)
          viable = caught + len(missed)
          rate = (len(missed) / viable * 100) if viable else 0.0

          emit("## Mutation testing\n")
          emit(f"**{rate:.0f}% survival** \u2014 {len(missed)} survived of {viable} viable "
               f"(caught {caught}, unviable {unviable}, timeout {timeout}).\n")
          emit("A survivor means the tests would not notice that change.\n")

          if missed:
              emit("| file | line | function | mutation |")
              emit("|------|-----:|----------|----------|")
              for o in missed:
                  # scenario is `{\"Mutant\": {...}}` for a real mutant and the
                  # string \"Baseline\" otherwise; missed are always the former,
                  # but read defensively so a schema change cannot crash the report.
                  scen = o.get("scenario")
                  m = scen.get("Mutant") if isinstance(scen, dict) else None
                  if not m:
                      continue
                  fn = (m.get("function") or {}).get("function_name", "?")
                  line = (((m.get("span") or {}).get("start") or {}).get("line", "?"))
                  repl = (m.get("replacement") or "").replace("|", "\\|").replace("\n", " ")
                  emit(f"| {m.get('file','?')} | {line} | {fn} | {repl} |")

          emit("\nKnown artifact: cfg(not(unix)) branches cannot run on this platform.")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-outcomes
          # The whole output directory, not just outcomes.json: missed.txt,
          # the per-mutant diffs and logs are what a human actually reads when
          # investigating a survivor.
          path: target/mutants/mutants.out/
          if-no-files-found: error
          retention-days: 14
