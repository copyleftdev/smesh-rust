[package]
name = "smesh-agent"
version.workspace = true
edition.workspace = true
description = "LLM agent integration for SMESH protocol"

[dependencies]
smesh-core = { path = "../smesh-core" }
smesh-runtime = { path = "../smesh-runtime" }
tokio = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
uuid = { workspace = true }
rmcp = { version = "3.9.0", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "transport-async-rw"] }
toml = "0.8"

[dev-dependencies]
rmcp = { version = "3.9.0", default-features = false, features = ["server", "client", "transport-async-rw"] }
